<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1456d6">
<title>Smart Safety</title>
<style>
:root{
  --blue:#1456d6; --blue-d:#0d3a99; --blue-l:#e8f0ff; --ink:#0f1b33; --muted:#5b6b88;
  --line:#dbe4f5; --bg:#f4f8ff; --card:#ffffff; --red:#d92d20; --red-d:#b4180d;
  --green:#12805c; --amber:#b45309; --radius:16px;
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans Tamil","Latha","Nirmala UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body{min-height:100vh;display:flex;justify-content:center}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
header .logo{width:34px;height:34px;flex:none}
header h1{font-size:18px;margin:0;font-weight:700;flex:1;line-height:1.1}
header h1 small{display:block;font-weight:500;font-size:11px;opacity:.85}
.pill{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill.on{background:#fff;color:var(--blue-d)}
.banner{background:#fff4d6;color:#6b4400;border-bottom:1px solid #f0d58a;padding:8px 14px;font-size:13px;font-weight:600}
main{flex:1;padding:14px 14px 100px}
.screen{display:none}.screen.active{display:block}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--blue);color:#fff}
.btn.sec{background:var(--blue-l);color:var(--blue-d)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.pill:focus-visible,.nav button:focus-visible,.sos:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.sos-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
.sos{width:210px;height:210px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff6a5c,var(--red) 55%,var(--red-d));color:#fff;font-size:56px;font-weight:800;letter-spacing:2px;box-shadow:0 0 0 12px rgba(217,45,32,.13),0 0 0 26px rgba(217,45,32,.07),0 12px 28px rgba(217,45,32,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sos small{font-size:13px;font-weight:600;letter-spacing:0;max-width:150px;line-height:1.2}
.sos:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){.sos{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(217,45,32,.16),0 0 0 34px rgba(217,45,32,.05),0 12px 28px rgba(217,45,32,.4)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.tile svg{width:26px;height:26px;color:var(--blue)}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--blue-l);color:var(--blue-d)}
.chip.g{background:#d8f3e8;color:var(--green)}.chip.a{background:#ffecc7;color:var(--amber)}.chip.r{background:#fde1de;color:var(--red-d)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--muted)}
input,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.person{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav button{flex:1;border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.active{color:var(--blue)}
.tip{display:flex;gap:12px}
.tip .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center}
.tip .n svg{width:20px;height:20px}
.overlay{position:fixed;inset:0;background:rgba(10,20,45,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.count{font-size:96px;font-weight:800;color:var(--red);text-align:center;line-height:1}
.map{width:100%;height:210px;border:0;border-radius:12px;background:var(--blue-l)}
.msgbox{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f1b33;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:70;max-width:90%;text-align:center}
.hist{border-left:4px solid var(--blue);padding:8px 10px;background:#fff;border-radius:8px;border:1px solid var(--line);border-left-width:4px}
.hist.c{border-left-color:#8a96ad}.hist.s{border-left-color:var(--green)}.hist.w{border-left-color:var(--amber)}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px}
.steps li{margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:48px;height:28px;accent-color:var(--blue)}
.note{font-size:12.5px;color:var(--muted);background:var(--blue-l);border-radius:10px;padding:9px 11px}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 6 10v13c0 11 7.6 19.4 18 22 10.4-2.6 18-11 18-22V10L24 3Z" fill="#fff"/><path d="M24 12v13M24 31v2" stroke="#d92d20" stroke-width="5" stroke-linecap="round"/></svg>
    <h1 id="hTitle">Smart Safety<small id="hSub"></small></h1>
    <button class="pill" id="demoBtn"></button>
    <button class="pill" id="langBtn" aria-label="Language"></button>
  </header>
  <div class="banner" id="demoBanner" hidden></div>
  <main>
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-contacts"></section>
    <section class="screen" id="s-tips"></section>
    <section class="screen" id="s-profile"></section>
  </main>
  <nav class="nav" id="nav"></nav>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

  const cs=h.contacts||[];const conf=cs.filter(c=>c.state==="confirmed").length,op=cs.filter(c=>c.state==="opened").length;
  if(conf)return{txt:t("stConfirmed")+` (${conf}/${cs.length})`,cls:"s"};
  if(op)return{txt:t("stOpened")+` (${op}/${cs.length})`,cls:"w"};
  return{txt:t("stPrepared"),cls:"c"};
}
function renderProfile(){
  const p=S.profile;
  $("#s-profile").innerHTML=`<h2>${esc(t("profileTitle"))}</h2>
   <div class="card"><label for="pName" style="margin-top:0">${esc(t("yourName"))}</label><input id="pName" value="${esc(p.name)}" autocomplete="name">
    <label for="pPhone">${esc(t("yourPhone"))}</label><input id="pPhone" type="tel" inputmode="tel" value="${esc(p.phone)}" placeholder="+91…">
    <label for="pRegion">${esc(t("region"))}</label><select id="pRegion">${Object.entries(NUMBERS).map(([k,v])=>`<option value="${k}" ${p.region===k?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
    <button class="btn block" data-act="saveprofile" style="margin-top:14px">${esc(t("save"))}</button></div>
   <div class="card"><h3>${esc(t("trusted"))}</h3><p class="muted" style="margin:0 0 8px">${S.contacts.length} ${esc(t("members"))}</p><button class="btn sm sec" data-act="gocontacts">${esc(t("contacts"))}</button></div>
   <div class="card"><h3>${esc(t("prefs"))}</h3><div class="switch"><span>${esc(t("shake"))}</span><input type="checkbox" id="shakeToggle" ${S.shake?"checked":""} aria-label="${esc(t("shake"))}"></div><p class="muted" style="margin:6px 0 0">${esc(t("shakeBody"))}</p></div>
   <h2 id="hist">${esc(t("history"))}</h2>
   <div class="list">${S.history.length?S.history.map(h=>{const st=statusOf(h);return `<div class="hist ${st.cls}"><div class="row"><b class="grow">${esc(fmtTime(h.ts))}</b>${h.demo?'<span class="chip a">Demo</span>':""}</div><div class="muted">${esc(st.txt)}</div>${h.loc?`<a href="${esc(mapsLink(h.loc))}" target="_blank" rel="noopener" style="font-size:14px">${esc(t("openMaps"))}</a>`:""}</div>`}).join(""):`<p class="muted">${esc(t("histEmpty"))}</p>`}</div>
   ${S.history.length?`<button class="btn sm ghost" data-act="clearhist" style="margin-top:10px">${esc(t("clear"))}</button>`:""}
   <div class="card" style="margin-top:16px"><h3>${esc(t("aboutTitle"))}</h3><ul class="steps">${T[S.lang].about.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
/* ---------- overlay helper ---------- */
function showSheet(html){const o=$("#overlay");o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;o.hidden=false}
function closeSheet(){const o=$("#overlay");o.hidden=true;o.innerHTML=""}
/* ---------- location ---------- */
function geoOK(){return "geolocation" in navigator}
function getPosition(timeout){
  return new Promise(res=>{
    if(!geoOK())return res({err:"unsupported"});
    navigator.geolocation.getCurrentPosition(p=>res({loc:{lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}}),e=>res({err:e.code===1?"denied":"failed"}),{enableHighAccuracy:true,timeout:timeout||9000,maximumAge:15000});
  });
}
function askLocConsent(){
  return new Promise(res=>{
    showSheet(`<h3>${esc(t("locAsk"))}</h3><p class="muted">${esc(t("locAskBody"))}</p>
      <button class="btn block" id="lcAllow">${esc(t("allow"))}</button><button class="btn ghost block" id="lcSkip" style="margin-top:8px">${esc(t("skipLoc"))}</button>`);
    $("#lcAllow").onclick=()=>{S.locConsent=true;saveState();closeSheet();res(true)};
    $("#lcSkip").onclick=()=>{S.locConsent=false;saveState();closeSheet();res(false)};
  });
}
async function ensureLocation(){
  if(S.demo)return{loc:DEMO_LOC};
  if(S.locConsent!==true){const ok=await askLocConsent();if(!ok)return{err:"skipped"}}
  return getPosition();
}
/* ---------- live location ---------- */
function startLive(){
  if(S.demo){live={...DEMO_LOC};showLive();return}
  (async()=>{
    if(S.locConsent!==true){const ok=await askLocConsent();if(!ok)return}
    if(!geoOK()){toast(t("gpsNo"));return}
    live=null;showLive();
    watchId=navigator.geolocation.watchPosition(p=>{live={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};showLive()},e=>{stopLive();toast(e.code===1?t("gpsDenied"):t("locFail"))},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  })();
}
function stopLive(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}live=null;closeSheet()}
function showLive(){
  const body=live?`<iframe class="map" title="Map" loading="lazy" src="https://maps.google.com/maps?q=${live.lat},${live.lng}&z=16&output=embed"></iframe>
    <div class="kv"><span>GPS</span><b>${live.lat.toFixed(5)}, ${live.lng.toFixed(5)}</b></div><div class="kv"><span>${esc(t("acc"))}</span><b>±${live.acc} m</b></div>
    <div class="row" style="flex-wrap:wrap;margin-top:10px"><a class="btn sm" href="${esc(mapsLink(live))}" target="_blank" rel="noopener" style="text-decoration:none">${esc(t("openMaps"))}</a><button class="btn sm sec" id="lvCopy">${esc(t("copyLink"))}</button>${navigator.share?`<button class="btn sm sec" id="lvShare">${esc(t("shareBtn"))}</button>`:""}</div>`
    :`<p class="muted">${esc(t("locating"))}</p>`;
  showSheet(`<h3>${esc(t("liveLoc"))}</h3><p class="muted" style="margin:0 0 8px">${esc(live?t("liveOn"):"")}</p>${body}<p class="note" style="margin-top:10px">${esc(t("liveNote"))}</p><button class="btn ghost block" id="lvStop" style="margin-top:10px">${esc(t("stopLive"))}</button>`);
  $("#lvStop").onclick=stopLive;
  if(live){$("#lvCopy").onclick=()=>copyText(mapsLink(live));const sh=$("#lvShare");if(sh)sh.onclick=()=>navigator.share({title:"Smart Safety",text:t("msgLoc")+": "+mapsLink(live),url:mapsLink(live)}).catch(()=>{})}
}
/* ---------- emergency call ---------- */
function showCall(){
  const nums=NUMBERS[S.profile.region]||NUMBERS.IN;
  showSheet(`<h3>${esc(t("callTitle"))} — ${esc(nums.name)}</h3><p class="note">${esc(t("callNote"))}</p><div class="list" style="margin-top:10px">${nums.list.map(n=>`<a class="person" href="tel:${n[0]}" style="text-decoration:none;color:inherit"><div class="avatar" style="background:#fde1de;color:var(--red-d)">${ICON.phone.replace("<svg",'<svg width="20" height="20"')}</div><div class="grow"><b>${esc(S.lang==="ta"?n[3]:n[2])}</b></div><b style="font-size:22px;color:var(--red-d)">${n[0]}</b></a>`).join("")}</div><button class="btn ghost block" id="clClose" style="margin-top:12px">${esc(t("done"))}</button>`);
  $("#clClose").onclick=closeSheet;
}
/* ---------- SOS flow ---------- */
function startSOS(){
  if(sos)return;
  const cs=activeContacts();
  if(!cs.length){toast(t("addFirst"));go("contacts");return}
  sos={phase:"count",left:5,cancelled:false};
  showCount();
  sos.timer=setInterval(()=>{
    sos.left--;
    if(sos.left<=0){clearInterval(sos.timer);runSend()}else showCount();
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  },1000);
}
function showCount(){
  showSheet(`<p class="muted" style="text-align:center;margin:0">${esc(t("cd1"))}</p><div class="count" aria-live="polite">${sos.left}</div><p class="muted" style="text-align:center;margin:0 0 14px">${esc(t("cd2"))}</p><button class="btn block" id="cdCancel" style="font-size:18px;padding:16px">${esc(t("cancelSOS"))}</button>`);
  $("#cdCancel").onclick=cancelSOS;
}
function cancelSOS(){
  if(!sos)return;clearInterval(sos.timer);
  S.history.unshift({id:uid(),ts:Date.now(),demo:S.demo,status:"cancelled",loc:null,contacts:[]});saveState();
  sos=null;closeSheet();toast(t("stCancelled"));if(tab==="profile")render();
}
function buildMessage(loc,err){
  const nm=S.profile.name||(S.lang==="ta"?"ஒரு நண்பர்":"A contact");
  const when=fmtTime(Date.now());
  const en=`SOS! I need help.\nFrom: ${nm}${S.profile.phone?" ("+S.profile.phone+")":""}\n`+(loc?`My location: ${mapsLink(loc)} (accuracy ±${loc.acc} m)\n`:`My location could not be read.\n`)+`Time: ${when}`;
  const ta=`SOS! எனக்கு உதவி தேவை.\nஅனுப்புநர்: ${nm}\n`+(loc?`என் இருப்பிடம்: ${mapsLink(loc)}\n`:`என் இருப்பிடத்தைப் படிக்க முடியவில்லை.\n`);
  return S.demo?"[DEMO — NOT SENT]\n"+en:en+"\n\n"+ta;
}
async function runSend(){
  showSheet(`<h3>${esc(t("locating"))}</h3><p class="muted">…</p>`);
  const r=await ensureLocation();
  if(!sos)return;
  const loc=r.loc||null;
  if(!loc)toast(t("locFail"));
  const cs=activeContacts();
  const entry={id:uid(),ts:Date.now(),demo:S.demo,status:"prepared",loc,msg:buildMessage(loc),contacts:cs.map(c=>({id:c.id,name:c.name,phone:c.phone,state:"pending"}))};
  S.history.unshift(entry);saveState();
  sos={phase:"send",entry};
  showSend();
}
function showSend(){
  const e=sos.entry;const nums=NUMBERS[S.profile.region]||NUMBERS.IN;
  const rows=e.contacts.map(c=>{
    const label=c.state==="confirmed"?t("markedSent"):c.state==="opened"?t("opened"):t("pending");
    const cls=c.state==="confirmed"?"g":c.state==="opened"?"a":"";
    const body=encodeURIComponent(e.msg);
    const ph=cleanPhone(c.phone);
    const act=e.demo?"":`<div class="row" style="flex-wrap:wrap;margin-top:8px">
        <a class="btn sm" data-open="${c.id}" href="sms:${esc(ph)}?body=${body}" style="text-decoration:none">${esc(t("sms"))}</a>
        <a class="btn sm sec" data-open="${c.id}" href="https://wa.me/${esc(ph.replace(/^\+/,""))}?text=${body}" target="_blank" rel="noopener" style="text-decoration:none">${esc(t("wa"))}</a>
        <button class="btn sm ghost" data-mark="${c.id}" ${c.state==="confirmed"?"disabled":""}>${esc(t("markSent"))}</button></div>`;
    return `<div class="person" style="flex-direction:column;align-items:stretch"><div class="row"><div class="avatar">${esc(initials(c.name))}</div><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)}</div></div><span class="chip ${cls}">${esc(label)}</span></div>${act}</div>`;
  }).join("");
  const map=e.loc?`<iframe class="map" title="Map" loading="lazy" style="height:150px;margin:10px 0" src="https://maps.google.com/maps?q=${e.loc.lat},${e.loc.lng}&z=16&output=embed"></iframe>`:"";
  showSheet(`<h3>${esc(t("sendTitle"))}</h3><p class="note">${esc(e.demo?t("simDone"):t("sendBody"))}</p>${map}
    <div class="msgbox">${esc(e.msg)}</div>
    <div class="row" style="flex-wrap:wrap;margin:10px 0">
      <button class="btn sm sec" id="snCopy">${esc(t("copy"))}</button>${(!e.demo&&navigator.share)?`<button class="btn sm sec" id="snShare">${esc(t("shareBtn"))}</button>`:""}
      ${e.demo?`<button class="btn sm" id="snSim">${esc(t("simSend"))}</button>`:""}</div>
    <div class="list">${rows}</div>
    <a class="btn red block" href="tel:${nums.list[0][0]}" style="text-decoration:none;text-align:center;margin-top:12px">${esc(t("call112"))} (${nums.list[0][0]})</a>
    <button class="btn ghost block" id="snDone" style="margin-top:8px">${esc(t("done"))}</button>`);
  $("#snCopy").onclick=()=>copyText(e.msg);
  const sh=$("#snShare");if(sh)sh.onclick=()=>navigator.share({title:"SOS",text:e.msg}).catch(()=>{});
  const sim=$("#snSim");if(sim)sim.onclick=()=>{e.contacts.forEach(c=>c.state="simulated");saveState();toast(t("simDone"))};
  document.querySelectorAll("[data-open]").forEach(a=>a.addEventListener("click",()=>{const c=e.contacts.find(x=>x.id===a.dataset.open);if(c&&c.state==="pending"){c.state="opened";saveState();setTimeout(()=>sos&&showSend(),400)}}));
  document.querySelectorAll("[data-mark]").forEach(b=>b.onclick=()=>{const c=e.contacts.find(x=>x.id===b.dataset.mark);if(c){c.state="confirmed";saveState();showSend()}});
  $("#snDone").onclick=()=>{sos=null;closeSheet();if(tab==="profile")render()};
}
/* ---------- shake ---------- */
function enableShake(){
  return new Promise(async res=>{
    if(!("DeviceMotionEvent" in window)){toast(t("shakeNo"));return res(false)}
    try{
      if(typeof DeviceMotionEvent.requestPermission==="function"){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted"){toast(t("shakeNo"));return res(false)}}
    }catch(e){toast(t("shakeNo"));return res(false)}
    attachShake();res(true);
  });
}
function attachShake(){
  detachShake();
  let hits=[],last=0,cool=0;
  const h=e=>{
    const a=e.accelerationIncludingGravity;if(!a)return;
    const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
    const now=Date.now();
    if(Math.abs(mag-9.8)>16&&now-last>180){last=now;hits=hits.filter(x=>now-x<1800);hits.push(now);
      if(hits.length>=3&&now>cool&&!sos){hits=[];cool=now+10000;toast(t("shakeTrig"));startSOS()}}
  };
  window.addEventListener("devicemotion",h);
  shakeCleanup=()=>window.removeEventListener("devicemotion",h);
}
function detachShake(){if(shakeCleanup){shakeCleanup();shakeCleanup=null}}
/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const nav=ev.target.closest("[data-tab]");if(nav){go(nav.dataset.tab);return}
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="sos")startSOS();
  else if(a==="live")startLive();
  else if(a==="call")showCall();
  else if(a==="gocontacts")go("contacts");
  else if(a==="gohistory"){go("profile");setTimeout(()=>{const h=$("#hist");if(h)h.scrollIntoView()},50)}
  else if(a==="shakeinfo"){go("profile");setTimeout(()=>{const x=$("#shakeToggle");if(x)x.scrollIntoView({block:"center"})},50)}
  else if(a==="newcontact"){editing="new";renderContacts()}
  else if(a==="editcontact"){editing=id;renderContacts()}
  else if(a==="cancelcontact"){editing=null;renderContacts()}
  else if(a==="delcontact"){S.contacts=S.contacts.filter(c=>c.id!==id);saveState();renderContacts()}
  else if(a==="savecontact"){
    const name=$("#cName").value.trim(),phone=$("#cPhone").value.trim(),rel=$("#cRel").value.trim(),err=$("#cErr");
    if(!name){err.textContent=t("nameBad");return}
    if(!validPhone(phone)){err.textContent=t("phoneBad");return}
    if(editing==="new")S.contacts.push({id:uid(),name,phone:cleanPhone(phone),rel});
    else{const c=S.contacts.find(x=>x.id===editing);if(c){c.name=name;c.phone=cleanPhone(phone);c.rel=rel}}
    saveState();editing=null;renderContacts();toast(t("saved"));
  }
  else if(a==="saveprofile"){S.profile.name=$("#pName").value.trim();S.profile.phone=$("#pPhone").value.trim();S.profile.region=$("#pRegion").value;saveState();toast(t("saved"))}
  else if(a==="clearhist"){S.history=[];saveState();renderProfile()}
  else if(a==="sample"){if(!S.contacts.length){S.contacts=DEMO_CONTACTS.map(c=>({...c,id:uid()}));saveState()}toast(t("saved"));render()}
  else if(a==="simshake"){startSOS()}
  else if(a==="exitdemo"){S.demo=false;saveState();render()}
});
document.addEventListener("change",async ev=>{
  if(ev.target.id==="shakeToggle"){
    if(ev.target.checked){const ok=await enableShake();S.shake=ok;ev.target.checked=ok;if(ok)toast(t("shakeOn"))}
    else{S.shake=false;detachShake();toast(t("shakeOff"))}
    saveState();
  }
});
$("#langBtn").onclick=()=>{S.lang=S.lang==="en"?"ta":"en";saveState();render()};
$("#demoBtn").onclick=()=>{S.demo=!S.demo;saveState();render();if(S.demo)go("home")};
/* FIREBASE (optional, not enabled in this prototype):
   import {initializeApp} from "firebase/app"; import {getAuth} from "firebase/auth"; import {getFirestore} from "firebase/firestore";
   Use Auth for sign-in, Firestore for contacts/history sync, and a cloud function (e.g. FCM or an SMS provider)
   to send alerts server-side. Only then can delivery be confirmed by a provider receipt. */
if("serviceWorker" in navigator){/* intentionally not registered: keeps the single-file demo simple */}
if(S.shake){/* iOS needs a tap to re-grant motion access; Android re-attaches directly */
  if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission!=="function")attachShake();
  else S.shake=false;
}
render();
</script>
